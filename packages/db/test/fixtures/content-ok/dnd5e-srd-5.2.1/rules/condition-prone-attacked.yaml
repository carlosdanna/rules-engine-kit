key: condition.prone.attacked
phase: modifiers
priority: -10
label: "Prone: attacked from within 5 feet"
description: An attack roll against a prone creature has advantage if the attacker is within 5 feet.
tags: [condition, prone]
condition:
  all:
    - { "==": [{ "var": "action.type" }, "attack"] }
    - { "in": ["prone", { "var": "target.conditions" }] }
    - { "<=": [{ "var": "action.rangeFt" }, 5] }
effects:
  - type: rollMode
    target: { kind: attack, actor: $actor }
    mode: advantage
citation:
  source: srd-5.2.1
  section: "Rules Glossary > Prone [Condition]"
