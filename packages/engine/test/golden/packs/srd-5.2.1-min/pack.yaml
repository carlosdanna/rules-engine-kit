# A fixture, not content.
#
# Real packs live in `content/`, cover the core subset and are checked against the SRD
# before they are committed. This one exists to give the golden cases in `../../cases/` a
# profile to resolve and to exercise the authoring format end to end, and it is
# deliberately the smallest pack that does both. The citations name the sections the
# mechanics paraphrase; the numbers in each case's `expected.json` are derived by hand from
# those sections, never from what the engine produced.
