key: condition.restrained.attacking
op: add
phase: modifiers
priority: 304
label: "Restrained: attacking while restrained"
description: "A restrained creature has disadvantage on its attack rolls."
tags: [condition, restrained]
condition:
  all:
    - { "==": [{ "var": "action.type" }, "attack"] }
    - { "in": ["restrained", { "var": "actor.conditions" }] }

effects:
  - type: rollMode
    target: { kind: attack, actor: $actor }
    mode: disadvantage
citation:
  source: srd-5.2.1
  section: "Rules Glossary > Restrained [Condition]"
interpretation: null
