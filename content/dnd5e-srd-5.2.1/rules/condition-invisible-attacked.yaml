key: condition.invisible.attacked
op: add
phase: modifiers
priority: 306
label: "Invisible: attacked"
description: "Attack rolls against an invisible creature have disadvantage."
tags: [condition, invisible]
condition:
  all:
    - { "==": [{ "var": "action.type" }, "attack"] }
    - { "in": ["invisible", { "var": "target.conditions" }] }

effects:
  - type: rollMode
    target: { kind: attack, actor: $actor }
    mode: disadvantage
citation:
  source: srd-5.2.1
  section: "Rules Glossary > Invisible [Condition]"
interpretation: null
