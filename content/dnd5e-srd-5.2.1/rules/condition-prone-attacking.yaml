key: condition.prone.attacking
op: add
phase: modifiers
priority: 302
label: "Prone: attacking while prone"
description: "A prone creature has disadvantage on its attack rolls."
tags: [condition, prone]
condition:
  all:
    - { "==": [{ "var": "action.type" }, "attack"] }
    - { "in": ["prone", { "var": "actor.conditions" }] }

effects:
  - type: rollMode
    target: { kind: attack, actor: $actor }
    mode: disadvantage
citation:
  source: srd-5.2.1
  section: "Rules Glossary > Prone [Condition]"
interpretation: null
