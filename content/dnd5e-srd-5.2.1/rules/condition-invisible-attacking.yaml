key: condition.invisible.attacking
op: add
phase: modifiers
priority: 307
label: "Invisible: attacking while invisible"
description: "An invisible creature has advantage on its attack rolls."
tags: [condition, invisible]
condition:
  all:
    - { "==": [{ "var": "action.type" }, "attack"] }
    - { "in": ["invisible", { "var": "actor.conditions" }] }

effects:
  - type: rollMode
    target: { kind: attack, actor: $actor }
    mode: advantage
citation:
  source: srd-5.2.1
  section: "Rules Glossary > Invisible [Condition]"
interpretation: null
