# One fixture, both editions. The printed damage is the same in each; the difference is
# `mastery`, which only SRD 5.2.1 has a rule for. A bludgeoning weapon is what gives
# `damage.vulnerability` something to fire against — the skeleton's vulnerability is to
# bludgeoning, and every other weapon here deals slashing or piercing.
