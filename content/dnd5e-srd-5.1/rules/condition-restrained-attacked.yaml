key: condition.restrained.attacked
op: add
phase: modifiers
priority: 303
label: "Restrained: attacked"
description: "Attack rolls against a restrained creature have advantage."
tags: [condition, restrained]
condition:
  all:
    - { "==": [{ "var": "action.type" }, "attack"] }
    - { "in": ["restrained", { "var": "target.conditions" }] }

effects:
  - type: rollMode
    target: { kind: attack, actor: $actor }
    mode: advantage
citation:
  source: srd-5.1
  section: "Appendix PH-A: Conditions > Restrained"
interpretation: null
